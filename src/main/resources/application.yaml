spring:
  application:
    name: RenovaNDelve

  config:
    import: optional:file:.env[.properties]

# 정적 리소스에 대해 캐시 사용 안함
  web:
    resources:
      cache:
        cache-control:
          no-cache: true
          no-store: true
          must-revalidate: true

# 스키마 마이그레이션 (classpath:db/migration)
# - 시드 데이터는 반복 마이그레이션 R__seed_data.sql 이다. 내용이 바뀐 기동에서만 다시 실행된다.
#   (예전의 spring.sql.init + data.sql 방식은 Flyway와 함께 쓸 수 없어 옮겼다)
# - 빈 DB: V1(기준 스키마)부터 차례로 적용한다.
# - Flyway 도입 전에 ddl-auto로 만들어진 기존 DB: 이력 테이블이 없으므로 현재 상태를 V1로 간주(baseline)하고
#   V2부터 적용한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # 시드 데이터(R__seed_data.sql)에 '${'가 들어가도 Flyway 자리표시자로 해석하지 않는다
    placeholder-replacement: false

  jpa:
    hibernate:
      # 로컬은 update: 엔티티를 고치면 바로 반영된다. 단, 운영(prod)은 validate라서
      # 엔티티를 바꿨다면 같은 변경을 db/migration에 V{n}__설명.sql 로 반드시 추가해야 한다.
      ddl-auto: update
    properties:
#      javax.persistence.schema-generation.scripts.action: create # 엔티티 변경시 init.sql 추출 하기 위한 설정
#      javax.persistence.schema-generation.scripts.create-target: init.sql # 엔티티 변경시 init.sql 추출 하기 위한 설정
      hibernate:
        format_sql: true #쿼리문 보여주는 설정
    show-sql: true #쿼리문 보여주는 설정

  # OpenAI
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # JdbcChatMemory 테이블 자동 생성

    vectorstore:
      pgvector:
        initialize-schema: true # VectorStore 테이블 자동 생성 설정

    # OpenAI API Key
    openai:
      api-key: ${OPENAI_API_KEY}

      # 임베딩 모델 설정
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536 # 차원수
      # LLM 모델 설정
      chat:
        options:
          model: gpt-4o-mini

# Upload Config
  servlet:
    multipart:
      enabled: true
      max-request-size: 30MB
      max-file-size: 10MB

# JSON 설정 (날짜 변환 @JsonFormat)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

#PostgreSQL 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/renova_n_delve?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Auth2 Google
  security:
    oauth2:
      client:
        registration:
          google:
            # 시크릿은 저장소에 두지 않는다 (.env 또는 환경변수로 주입). 미설정 시 구글 로그인만 동작하지 않는다.
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope:
              - email
              - profile

#Logging 설정
logging:
  level:
    org:
      springframework: INFO
      springframework.ai: DEBUG
#      springframework.beans.factory: DEBUG
    com:
      renovandelve: DEBUG
  pattern:
    console: "%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n"

# JWT SECRET KEY
renovaNDelve:
  jwt:
    secret: ${JWT_SECRET_KEY}
  ai:
    # 서버 기동 시 RDB(몬스터/장비/스킬/유물/소모품) -> VectorStore 증분 동기화
    # 변경된 행만 재임베딩하므로 2회차부터는 임베딩 API 호출이 거의 발생하지 않는다.
    sync-on-startup: true

  # RefreshToken 쿠키의 Secure 속성 (HTTPS 전용). 로컬 개발은 false, 운영은 true (application-prod.yaml)
  cookie:
    secure: ${COOKIE_SECURE:false}

  # 개인정보 보관 기간
  privacy:
    # AI 대화 기록(가이드 챗봇 / 게임 서사)은 마지막 이용 후 이 기간이 지나면 자동 파기
    chat-retention-days: 30

  # 최초 관리자 계정 (관리자가 한 명도 없을 때만 생성됨)
  # password를 비워두면 서버가 임의 생성해 기동 로그에 1회만 출력한다.
  admin:
    login-id: ${ADMIN_LOGIN_ID:admin}
    password: ${ADMIN_PASSWORD:}