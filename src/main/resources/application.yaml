spring:
  application:
    name: RenovaNDelve

  config:
    import: optional:file:.env[.properties]

# 정적 리소스에 대해 캐시 사용 안함
  web:
    resources:
      cache:
        cache-control:
          no-cache: true
          no-store: true
          must-revalidate: true

# 스키마 마이그레이션 (classpath:db/migration)
# - 시드 데이터는 반복 마이그레이션 R__seed_data.sql 이다. 내용이 바뀐 기동에서만 다시 실행된다.
#   (예전의 spring.sql.init + data.sql 방식은 Flyway와 함께 쓸 수 없어 옮겼다)
# - 빈 DB: V1(기준 스키마)부터 차례로 적용한다.
# - Flyway 도입 전에 ddl-auto로 만들어진 기존 DB: 이력 테이블이 없으므로 현재 상태를 V1로 간주(baseline)하고
#   V2부터 적용한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # 시드 데이터(R__seed_data.sql)에 '${'가 들어가도 Flyway 자리표시자로 해석하지 않는다
    placeholder-replacement: false

  jpa:
    # OSIV 끔: 영속성 컨텍스트(DB 커넥션)를 트랜잭션이 끝날 때 닫는다.
    # 켜 두면 요청이 끝날 때까지 커넥션을 붙잡아, LLM 응답을 기다리는 노드 전진 같은 긴 요청이
    # 커넥션 풀을 고갈시킨다. 대신 지연 로딩은 반드시 @Transactional 안(서비스)에서 끝내고,
    # 컨트롤러에는 DTO만 넘긴다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 테이블이 맞는지 검사만 한다(전 프로파일 공통).
      # 엔티티를 바꾸면 같은 변경을 db/migration에 V{n}__설명.sql 로 추가해야 기동된다.
      # (update로 두면 마이그레이션을 빠뜨려도 로컬에서는 돌아서, 운영에서야 문제가 드러난다)
      ddl-auto: validate
    properties:
#      javax.persistence.schema-generation.scripts.action: create # 엔티티 변경시 init.sql 추출 하기 위한 설정
#      javax.persistence.schema-generation.scripts.create-target: init.sql # 엔티티 변경시 init.sql 추출 하기 위한 설정
      hibernate:
        format_sql: true #쿼리문 보여주는 설정
    show-sql: true #쿼리문 보여주는 설정

  # OpenAI
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # JdbcChatMemory 테이블 자동 생성

    vectorstore:
      pgvector:
        initialize-schema: true # VectorStore 테이블 자동 생성 설정

    # OpenAI API Key
    openai:
      api-key: ${OPENAI_API_KEY}

      # 임베딩 모델 설정
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536 # 차원수
      # LLM 모델 설정
      chat:
        options:
          model: gpt-4o-mini

# Upload Config
  servlet:
    multipart:
      enabled: true
      max-request-size: 30MB
      max-file-size: 10MB

# JSON 설정 (날짜 변환 @JsonFormat)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

#PostgreSQL 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/renova_n_delve?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# 메일 (아이디 찾기 / 비밀번호 재설정)
# 계정 정보는 저장소에 두지 않는다 (.env 또는 환경변수). 비워 두면 서버는 그대로 기동되고 메일 발송만 생략된다.
# 네이버: 메일 설정에서 POP3/SMTP 사용을 켜야 한다. 2단계 인증을 쓰면 애플리케이션 비밀번호를 MAIL_PASSWORD에 넣는다.
  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 465는 처음부터 TLS(SSL), 587은 STARTTLS. 587을 쓰려면 MAIL_PORT=587, MAIL_SSL=false
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: true
          # SMTP 서버가 응답하지 않아도 스레드가 묶이지 않게 한다
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Auth2 Google
  security:
    oauth2:
      client:
        registration:
          google:
            # 시크릿은 저장소에 두지 않는다 (.env 또는 환경변수로 주입). 미설정 시 구글 로그인만 동작하지 않는다.
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope:
              - email
              - profile

#Logging 설정
logging:
  level:
    org:
      springframework: INFO
      springframework.ai: DEBUG
#      springframework.beans.factory: DEBUG
    com:
      renovandelve: DEBUG
  pattern:
    console: "%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n"

# JWT SECRET KEY
renovaNDelve:
  jwt:
    secret: ${JWT_SECRET_KEY}
  ai:
    # 서버 기동 시 RDB(몬스터/장비/스킬/유물/소모품) -> VectorStore 증분 동기화
    # 변경된 행만 재임베딩하므로 2회차부터는 임베딩 API 호출이 거의 발생하지 않는다.
    sync-on-startup: true

  # 메일에 넣는 링크의 기준 주소 (프론트 주소). 요청의 Host 헤더로 만들지 않는다 (위조된 Host로 링크를 바꿔치기하는 것 방지)
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}

  mail:
    # 보내는 주소. 비워 두면 MAIL_USERNAME으로 만든다 (네이버는 로그인한 계정의 주소로만 보낼 수 있다)
    from: ${MAIL_FROM:}

  # RefreshToken 쿠키의 Secure 속성 (HTTPS 전용). 로컬 개발은 false, 운영은 true (application-prod.yaml)
  cookie:
    secure: ${COOKIE_SECURE:false}

  # 개인정보 보관 기간
  privacy:
    # AI 대화 기록(가이드 챗봇 / 게임 서사)은 마지막 이용 후 이 기간이 지나면 자동 파기
    chat-retention-days: 30

  # 최초 관리자 계정 (관리자가 한 명도 없을 때만 생성됨)
  # password를 비워두면 서버가 임의 생성해 기동 로그에 1회만 출력한다.
  admin:
    login-id: ${ADMIN_LOGIN_ID:admin}
    password: ${ADMIN_PASSWORD:}