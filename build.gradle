plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}
ext {
    springAiVersion = "1.1.5"
}

group = 'com'
version = '0.10.0'
description = 'RenovaNDelve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 메일 발송 (아이디 찾기 / 비밀번호 재설정)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.security:spring-security-test'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 테스트용 가짜 SMTP 서버 (메일이 실제 SMTP 프로토콜로 나가는지 확인)
    testImplementation 'com.icegreen:greenmail-junit5:2.1.2'
    implementation 'org.springframework.ai:spring-ai-rag'

    // 스키마 마이그레이션 (db/migration/V*.sql)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'



    // JSON 변환 라이브러리
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // JWT
    // Source: https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt
    implementation("io.jsonwebtoken:jjwt:0.12.6")
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ===== 프론트와 함께 배포 =====
// ./gradlew bootJar -PwithFrontend                     -> 프론트(../renova-delve-front)를 빌드해 jar의 static/ 에 넣는다
// ./gradlew bootJar -PwithFrontend -PfrontendDir=경로  -> 프론트 저장소가 다른 곳에 있을 때
// 옵션 없이 빌드하면 예전처럼 백엔드만 (개발할 때는 Vite 개발 서버가 /api 를 8080으로 넘긴다)
def frontendDir = file(findProperty('frontendDir') ?: '../renova-delve-front')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmCi', Exec) {
    group = 'frontend'
    description = '프론트 의존성 설치 (package-lock.json 기준)'
    workingDir frontendDir
    commandLine npmCommand, 'ci'
    inputs.file(new File(frontendDir, 'package-lock.json'))
    outputs.dir(new File(frontendDir, 'node_modules'))
}

tasks.register('buildFrontend', Exec) {
    group = 'frontend'
    description = '프론트 빌드 (dist/). VITE_ 로 시작하는 환경변수는 이때 값이 박힌다'
    dependsOn 'npmCi'
    workingDir frontendDir
    commandLine npmCommand, 'run', 'build'
    inputs.dir(new File(frontendDir, 'src'))
    inputs.files(new File(frontendDir, 'index.html'), new File(frontendDir, 'package.json'), new File(frontendDir, 'vite.config.ts'))
    outputs.dir(new File(frontendDir, 'dist'))
}

if (project.hasProperty('withFrontend')) {
    tasks.named('processResources') {
        dependsOn 'buildFrontend'
        from(new File(frontendDir, 'dist')) { into 'static' }
    }
}
